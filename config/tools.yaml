# config/tools.yaml
---
# 工具配置 - 控制每个工具的启用/禁用

tools:
  read_file:
    enabled: true
    description: 读取文件内容

  write_file:
    enabled: true
    description: 写入文件内容

  delete_file:
    enabled: true
    description: 删除文件

  list_files:
    enabled: true
    description: 列出目录文件

  verify_file:
    enabled: true
    description: 验证文件

  # 命令执行工具
  run_command:
    enabled: true
    description: 执行系统命令

  # 文件修改工具
  modify_file:
    enabled: true
    description: 健壮修改文件

  # 记忆工具
  remember:
    enabled: true
    description: 记住信息

  recall:
    enabled: true
    description: 回忆信息

  # RAG 工具
  rag_add:
    enabled: true
    description: 添加文件到RAG

  rag_search:
    enabled: true
    description: 搜索RAG知识库

  rag_ask:
    enabled: true
    description: 基于RAG问答

  rag_list:
    enabled: true
    description: 列出RAG项目

  rag_stats:
    enabled: true
    description: RAG统计

  # 命令工具
  get_time:
    enabled: true
    description: 获取时间

  get_date:
    enabled: true
    description: 获取日期

  get_timestamp:
    enabled: true
    description: 获取时间戳